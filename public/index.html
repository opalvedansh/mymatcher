<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <!-- The web app is served under /app (app.json experiments.baseUrl). The
         manifest lets iPhone users add it to the home screen, which iOS
         requires before it allows web push. -->
    <link rel="manifest" href="/app/manifest.json" />
    <link rel="apple-touch-icon" href="/app/icon-512.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0F0F0F" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
        background-color: #0F0F0F;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* react-native-web renders each <Modal> into its own div on <body>,
         outside the centred 430px app column (app/_layout.tsx). Keep modals
         in that column too; the transform makes this box the reference for
         the modal's position: fixed layers. */
      body > div:not(#root):not([style]) > div {
        max-width: 430px;
        margin: 0 auto;
        transform: translateZ(0);
        overflow: hidden;
      }
    </style>
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <div id="root"></div>
  </body>
</html>
