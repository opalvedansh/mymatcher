# Web app (Expo web build), deployed as Netlify site "matchr-web" and served to
# users at https://mymatchr.in/app through the landing site's proxy.
# Built under /app to match app.json experiments.baseUrl.
[build]
  command = "npx expo export -p web && rm -rf out && mkdir -p out && mv dist out/app"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"

# Real files win; every other /app route is the single-page app.
[[redirects]]
  from = "/app/*"
  to = "/app/index.html"
  status = 200

# Browser-side hardening. frame-ancestors/X-Frame-Options stop other sites from
# framing the app (clickjacking a "Delete account" tap); the CSP only lets the
# bundle talk to the API and Supabase and run its own scripts.
[[headers]]
  for = "/app/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' blob: data: https://api.mymatchr.in wss://api.mymatchr.in https://*.supabase.co wss://*.supabase.co; worker-src 'self'; manifest-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(self), geolocation=(self), payment=()"
